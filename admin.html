<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace administrateur — JAE Ministries</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== CONNEXION ===================== -->
<section id="view-login" class="view active">
  <div class="admin-login">
    <div class="admin-login-card">
      <h2>Espace administrateur</h2>
      <p class="sub">JAE Ministries — accès réservé</p>

      <div class="form-error-banner" id="login-error-banner"></div>

      <form id="login-form">
        <div class="field">
          <label for="login-email">Adresse e-mail</label>
          <input type="text" id="login-email" autocomplete="username" placeholder="votre@email.com" required>
        </div>
        <div class="field">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Se connecter</button>
      </form>
      <p class="submit-note"><a href="index.html">&larr; Retour au site</a></p>
    </div>
  </div>
</section>

<!-- ===================== TABLEAU DE BORD ===================== -->
<section id="view-dashboard" class="view admin-view">
  <div class="wrap">

    <div class="admin-header">
      <div class="title">
        <img src="assets/logo.jpg" alt="Logo JAE Ministries">
        <div>
          <h1>Témoignages reçus</h1>
          <div class="sub" id="today-date"></div>
        </div>
      </div>
      <div class="admin-actions">
        <button class="btn btn-ghost" id="btn-refresh" type="button">Actualiser</button>
        <button class="btn btn-ghost" id="btn-logout" type="button">Déconnexion</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <span class="num" id="stat-today">—</span>
        <span class="label">Aujourd'hui</span>
      </div>
      <div class="stat-card">
        <span class="num" id="stat-total">—</span>
        <span class="label">20 derniers jours</span>
      </div>
      <div class="stat-card">
        <span class="num" id="stat-days">—</span>
        <span class="label">Jours représentés</span>
      </div>
    </div>

    <div id="dashboard-content">
      <div class="loading-state">Chargement des témoignages…</div>
    </div>

  </div>
</section>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — JAE Ministries</title>
  <link rel="icon" href="img/logo.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-body">

  <!-- Écran de connexion -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <img src="img/logo.jpg" alt="JAE Ministries" class="login-logo" />
      <h1>Espace Administrateur</h1>
      <p class="login-subtitle">JAE Ministries — Recueil de témoignages</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" required placeholder="jaeweb001@gmail.com" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div id="login-error" class="error-msg" hidden></div>
        <button type="submit" class="btn btn-gold btn-lg" style="width:100%" id="login-btn">
          <span class="btn-text">Se connecter</span>
          <span class="btn-loading" hidden>Connexion...</span>
        </button>
      </form>
      <a href="index.html" class="back-link">← Retour au site</a>
    </div>
  </div>

  <!-- Dashboard Admin -->
  <div id="dashboard" hidden>
    <header class="admin-header">
      <div class="container header-inner">
        <div class="brand">
          <img src="img/logo.jpg" alt="JAE Ministries" class="brand-logo" style="width:44px;height:44px" />
          <div class="brand-text">
            <span class="brand-name">Administration</span>
            <span style="font-size:0.75rem;color:var(--muted)">Témoignages des 20 derniers jours</span>
          </div>
        </div>
        <div class="admin-actions">
          <button class="btn btn-outline" id="btn-refresh">Actualiser</button>
          <button class="btn btn-outline" id="btn-logout">Déconnexion</button>
        </div>
      </div>
    </header>

    <main class="container admin-main">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-total">—</div>
          <div class="stat-label">Total (20 jours)</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-today">—</div>
          <div class="stat-label">Aujourd’hui</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-hommes">—</div>
          <div class="stat-label">Hommes</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-femmes">—</div>
          <div class="stat-label">Femmes</div>
        </div>
      </div>

      <div class="admin-section">
        <div class="section-header-row">
          <h2>Témoignages reçus</h2>
          <span class="badge" id="count-badge">0 témoignage</span>
        </div>
        <div id="temoignages-list" class="temoignages-list">
          <div class="loading">Chargement des témoignages...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
